# Windows wheel builder (dispatch dry-run harness).
#
# HISTORY: v0.4.1 experiment - three configurations tried on 2026-08-29
# (network + sub-packages, network, local installer); all died at the
# Jimver/cuda-toolkit action's cache-path validation within ~2 minutes
# on windows-2022 runners, before any CUDA download completed.
#
# SINCE v0.5 the maintained Windows wheel path lives in publish.yml
# (build-windows job: manual curl + silent network install, the
# documented enterprise route that bypasses the broken action). This
# workflow stays as a standalone dispatch target to dry-run the Windows
# build WITHOUT publishing, using the same manual-install method.

name: windows-wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit (silent network install)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_12.4.1_551.78_windows_network.exe"
          curl.exe -L --retry 3 -o cuda_net.exe $url
          if ($LASTEXITCODE -ne 0) { throw "cuda installer download failed" }
          Start-Process -Wait -FilePath ".\cuda_net.exe" -ArgumentList "-s","cudatoolkit"
          Remove-Item cuda_net.exe -Force
          $env:CUDA_PATH = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
            throw "nvcc not found after silent install"
          }
          "CUDA_PATH=$env:CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:CUDA_PATH\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          nvcc --version

      - name: Build the wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel
          path: dist/*.whl
          if-no-files-found: error
