# Windows wheel builder (v0.4.1 experiment - OUTCOME: NOT VIABLE YET).
#
# Three configurations were tried on 2026-08-29 (network + sub-packages,
# network, local installer): all fail at the Jimver/cuda-toolkit action's
# cache-path validation within ~2 minutes on windows-2022 runners
# ("Path(s) specified in the action for caching do(es) not exist"),
# before any CUDA download completes. The known workaround is a manual
# curl + silent-install step (the documented enterprise deployment
# route) - left for a future iteration if Windows PyPI wheels become a
# priority. The maintained path today: the maintainer-built cp312 wheel
# attached to every GitHub Release plus the verified pip source-build
# fallback (see README install notes).

name: windows-wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CUDA Toolkit (cached)
        uses: Jimver/cuda-toolkit@v0.2.27
        with:
          cuda: "12.4.1"
          method: "local"

      - name: Show toolkit
        shell: pwsh
        run: |
          nvcc --version
          $env:CUDA_PATH = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
          echo "CUDA_PATH=$env:CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          # mirror the reference machine's toolchain
          python -m pip install cmake ninja pybind11 scikit-build-core
          python -m build --wheel --outdir dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel
          path: dist/*.whl
          if-no-files-found: error
