# Wheel dry-run harness (dispatch-only, NEVER publishes).
#
# HISTORY: v0.4.1 experiment - three configurations tried on 2026-08-29
# (network + sub-packages, network, local installer); all died at the
# Jimver/cuda-toolkit action's cache-path validation within ~2 minutes
# on windows-2022 runners, before any CUDA download completed.
#
# SINCE v0.5 the maintained Windows wheel path lives in publish.yml
# (build-windows job: manual curl + silent network install, the
# documented enterprise route that bypasses the broken action).
#
# SINCE 1.0 this workflow mirrors the publish.yml wheel MATRIX as a
# dispatchable dry run: Linux manylinux wheels (cp310-cp313, inside the
# same CUDA container publish.yml uses) and Windows wheels (cp311-313,
# same manual silent CUDA install). Dispatching it on a dev ref
# validates the full release build matrix WITHOUT publishing anything.

name: wheel-dryrun

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      # actions/setup-python does not reliably work inside container jobs
      # - install the matrix python from deadsnakes, isolated per venv
      - name: Install Python ${{ matrix.python }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends software-properties-common \
              gpg-agent gnupg patchelf
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y --no-install-recommends \
              python${{ matrix.python }} python${{ matrix.python }}-venv
          python${{ matrix.python }} -m venv /tmp/venv
          echo "/tmp/venv/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          pip install --no-cache-dir build auditwheel "patchelf>=0.14.5"

      - name: Build the wheel
        run: |
          export PATH="$pythonLocation/bin:$PATH"
          python -m build --wheel --outdir dist .

      - name: Repair wheel to manylinux
        run: |
          export PATH="$pythonLocation/bin:$PATH"
          auditwheel show dist/fusedtok-*.whl
          auditwheel repair dist/fusedtok-*.whl -w wheelhouse/
          rm -f dist/fusedtok-*.whl
          mv wheelhouse/fusedtok-*.whl dist/

      - name: Smoke-test the wheel (import + CPU op)
        run: |
          export PATH="$pythonLocation/bin:$PATH"
          pip install dist/fusedtok-*.whl pytest numpy
          python -c "import fusedtok; print(fusedtok.__version__); print(fusedtok.rmsnorm([[1.0, 2.0]], [1.0, 1.0]))"
          python -m pytest tests -q

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-linux-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit (silent network install)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://developer.download.nvidia.com/compute/cuda/12.4.1/network_installers/cuda_12.4.1_windows_network.exe"
          $installer = Join-Path $PWD "cuda_net.exe"
          curl.exe -L -f --retry 3 -o $installer $url
          if ($LASTEXITCODE -ne 0) { throw "cuda installer download failed" }
          $size = (Get-Item $installer).Length
          if ($size -lt 20MB) { throw "installer too small: $size bytes" }
          $p = Start-Process -PassThru -Wait -FilePath $installer -ArgumentList "-s"
          "installer exit code: $($p.ExitCode)"
          Remove-Item $installer -Force
          $env:CUDA_PATH = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
            throw "nvcc not found after silent install"
          }
          "CUDA_PATH=$env:CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:CUDA_PATH\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:CUDA_PATH\bin\nvcc.exe" --version

      - name: Build the wheel
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          python -m pip install --upgrade pip build ninja
          python -m build --wheel --outdir dist .
          Get-ChildItem dist

      - name: Smoke-test the wheel (import + CPU op)
        shell: pwsh
        run: |
          pip install (Get-ChildItem dist/fusedtok-*.whl)
          python -c "import fusedtok; print(fusedtok.__version__); print(fusedtok.rmsnorm([[1.0, 2.0]], [1.0, 1.0]))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-windows-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
