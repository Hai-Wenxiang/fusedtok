name: Publish to PyPI

# Trusted Publishing (OIDC): no API tokens or passwords anywhere.
# The pending publisher configured on PyPI side:
#   project=fusedtok  owner=Hai-Wenxiang  repo=fusedtok
#   workflow=publish.yml  environment=(none)
#
# Jobs (1.0: per-python wheel matrix; the sdist is built exactly once):
#   build (matrix 3.10-3.13)
#                    - manylinux wheel per python, sdist from the 3.10
#                    entry only (duplicate sdists would fail the PyPI
#                    upload). CUDA container; the Docker publish action
#                    cannot run inside container jobs, so artifacts pass
#                    through the workflow artifact store to a plain
#                    ubuntu publisher.
#   build-windows (matrix 3.11-3.13)
#                    - cp3xx Windows wheels. CUDA installs via the
#                    network installer's documented silent mode
#                    (curl + "-s cudatoolkit"); the Jimver/cuda-toolkit
#                    action's cache validation was broken on
#                    windows-2022 runners (see windows-wheel.yml
#                    history), the manual route is the known bypass.
#   publish          - Trusted-Publisher upload of everything in dist/.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4

      # python-build-standalone ships its own headers; the container's
      # apt python is no longer part of the build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends patchelf
          # patchelf via pip: ubuntu22.04's apt copy (0.14.3) is older than
          # auditwheel's required >= 0.14.5
          pip install --no-cache-dir build auditwheel "patchelf>=0.14.5"

      - name: Build sdist (once, from the 3.10 entry) and wheel
        run: |
          if [ "${{ matrix.python }}" = "3.10" ]; then
            python -m build --sdist --outdir dist
          fi
          python -m build --wheel --outdir dist .

      - name: Repair wheel to manylinux (PyPI rejects bare linux tags)
        run: |
          auditwheel show dist/fusedtok-*.whl
          auditwheel repair dist/fusedtok-*.whl -w wheelhouse/
          rm -f dist/fusedtok-*.whl
          mv wheelhouse/fusedtok-*.whl dist/

      - name: List artifacts
        run: ls -lh dist/

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.python }}
          path: dist/
          if-no-files-found: error
          retention-days: 5

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # put cl.exe on PATH for Ninja (the runner image ships VS2022 but
      # does not export the dev environment)
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit (silent network install)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://developer.download.nvidia.com/compute/cuda/12.4.1/network_installers/cuda_12.4.1_windows_network.exe"
          $installer = Join-Path $PWD "cuda_net.exe"
          # -f: fail on HTTP errors instead of saving an error page as exe
          curl.exe -L -f --retry 3 -o $installer $url
          if ($LASTEXITCODE -ne 0) { throw "cuda installer download failed" }
          $size = (Get-Item $installer).Length
          if ($size -lt 20MB) { throw "cuda installer too small: $size bytes" }
          # bare -s (all components): component-scoped names like
          # cudatoolkit_12.4 make the network bootstrapper exit within
          # seconds installing nothing; the driver component may fail on
          # GPU-less runners but the toolkit still lands - success is
          # judged by nvcc.exe below, not the exit code
          $p = Start-Process -PassThru -Wait -FilePath $installer -ArgumentList "-s"
          "installer exit code: $($p.ExitCode)"
          Remove-Item $installer -Force
          $env:CUDA_PATH = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
          if (-not (Test-Path "$env:CUDA_PATH\bin\nvcc.exe")) {
            Get-ChildItem "$env:TEMP" -Recurse -Filter "cuda*" -ErrorAction SilentlyContinue |
              Select-Object -First 10 | ForEach-Object { $_.FullName }
            $cudalog = Join-Path $env:USERPROFILE "AppData\Local\Temp\CUDA\cuda.log"
            if (Test-Path $cudalog) { Get-Content $cudalog -Tail 40 }
            throw "nvcc not found after silent install"
          }
          "CUDA_PATH=$env:CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:CUDA_PATH\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:CUDA_PATH\bin\nvcc.exe" --version

      - name: Build the wheel
        shell: pwsh
        env:
          # Ninja matches the reference build; the VS generator's CUDA
          # targets need CudaToolkitDir (registry), which silent
          # installs do not write
          CMAKE_GENERATOR: Ninja
        run: |
          python -m pip install --upgrade pip build ninja
          python -m build --wheel --outdir dist .
          Get-ChildItem dist

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC).
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: List everything being published
        run: ls -lh dist/

      - name: Upload to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify project is live
        run: |
          sleep 10
          curl -fsS "https://pypi.org/pypi/fusedtok/json" | head -c 200 || true
